[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test=["pytest>=3.0.0"]
dev=["clang-tidy-converter-fips[test]", "ruff", "mypy"]

[project]
name = "clang-tidy-converter-fips"
version = "1.1.0"
requires-python = ">=3.5"
authors = [
  {name="Yuri Skatarenko", email="yurii.skatarenko@gmail.com"},
  {name="Abhiroop Kodandapur Sanjeeva"}
]
readme = "README.md"
description = "Python3 script to convert Clang-Tidy output to different formats."
license = "MIT"
keywords = ["code quality report", "clang-tidy", "clang", "code scans", "converter", "translation"]

[project.urls]
Repository = "https://github.com/Abhiroopks/clang-tidy-converter-fips"

